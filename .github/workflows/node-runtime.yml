name: Verify patched production runtime
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Build actual production image
        run: docker build -t node-patch:ci .
      - name: Verify production image Node version
        run: test "$(docker run --rm --entrypoint node node-patch:ci --version)" = "v22.23.4"
